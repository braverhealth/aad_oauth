name: aad_oauth
description: A Flutter OAuth package for performing user authentication against
  Azure Active Directory OAuth2 v2.0 endpoint.
version: 1.0.2
homepage: https://github.com/Earlybyte/aad_oauth

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0" # dart:js_interop extension types need Dart 3.3

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.2.0
  webview_flutter: ^4.4.1
  http: ^1.1.0
  shared_preferences: ^2.2.1
  dartz: ^0.10.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/msalv2.js
